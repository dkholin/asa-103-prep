name: Deploy to GitHub Pages

env:
  VITE_BASE_PATH: /asa-103-prep/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan tracked files for privileged secret material
        run: |
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|POSTHOG_PERSONAL_API_KEY' -- . ':(exclude).github/workflows/deploy.yml'; then
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
