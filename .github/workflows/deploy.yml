name: Deploy to GitHub Pages

env:
  VITE_BASE_PATH: /asa-103-prep/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan tracked files for privileged secret material
        run: |
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|POSTHOG_PERSONAL_API_KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- . ':(exclude).github/workflows/deploy.yml'; then
            exit 1
          fi
      - run: npm test
      - name: Validate Supabase public build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" && test -z "$VITE_E2E_FAKE_CLOUD"
      - name: Build production application
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Both PostHog values are browser-public, so they are repository
          # variables rather than secrets. Unset means the deployed app falls
          # back to the no-op analytics client instead of failing.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rebuild deploy artifact without the test cloud double
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
