<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" aria-label="Chart-border scale with points A and B and a transferred divider span.">
  <rect width="460" height="320" fill="#eef5fa"/>
  <text x="230" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a3d5c" text-anchor="middle">CHART BORDER AND DIVIDER SPAN</text>
  <!-- vertical latitude border with 1-minute ticks -->
  <g transform="translate(70 55)">
    <line x1="0" y1="0" x2="0" y2="240" stroke="#1a3d5c" stroke-width="2"/>
    <g stroke="#1a3d5c" stroke-width="1.5">
      <line x1="-8" y1="0" x2="0" y2="0"/>
      <line x1="-8" y1="40" x2="0" y2="40"/>
      <line x1="-8" y1="80" x2="0" y2="80"/>
      <line x1="-8" y1="120" x2="0" y2="120"/>
      <line x1="-8" y1="160" x2="0" y2="160"/>
      <line x1="-8" y1="200" x2="0" y2="200"/>
      <line x1="-8" y1="240" x2="0" y2="240"/>
    </g>
    <text x="-14" y="4" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1a3d5c">41°27'N</text>
    <text x="-14" y="84" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1a3d5c">41°25'N</text>
    <text x="-14" y="164" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1a3d5c">41°23'N</text>
    <text x="-14" y="244" font-family="sans-serif" font-size="12" text-anchor="end" fill="#1a3d5c">41°21'N</text>
  </g>
  <!-- two charted points with a divider span equal to 3 minutes (80px per 2 min => 40px per min, so 3 min = 120px) -->
  <g>
    <circle cx="260" cy="95" r="6" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <text x="272" y="99" font-family="sans-serif" font-size="13" fill="#1a3d5c">Point A</text>
    <circle cx="260" cy="215" r="6" fill="#c05621" stroke="#8a3c12" stroke-width="2"/>
    <text x="272" y="219" font-family="sans-serif" font-size="13" fill="#6b3410">Point B</text>
    <line x1="260" y1="95" x2="260" y2="215" stroke="#7a93a5" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M250 95 l10 -8 l10 8" fill="none" stroke="#456" stroke-width="1.5"/>
    <path d="M250 215 l10 8 l10 -8" fill="none" stroke="#456" stroke-width="1.5"/>
    <text x="330" y="160" font-family="sans-serif" font-size="13" fill="#1a3d5c" text-anchor="middle">Divider span walked</text>
    <text x="330" y="178" font-family="sans-serif" font-size="13" fill="#1a3d5c" text-anchor="middle">to the latitude border</text>
  </g>
</svg>
