<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Bird's-eye view of a dock with current running parallel to it, showing a boat approaching bow-first into the current so the current itself helps slow the boat during the approach">
  <rect width="420" height="260" fill="#dcebf5"/>
  <rect x="30" y="60" width="18" height="180" fill="#8a6d4c"/>
  <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#333">Dock</text>
  <g transform="translate(150 170) rotate(90)">
    <path d="M-70 -18 L60 -18 L80 0 L60 18 L-70 18 Z" fill="#c9c2b0" stroke="#333" stroke-width="2"/>
  </g>
  <path d="M340 80 L340 220" stroke="#2b6cb0" stroke-width="3" marker-end="url(#c1)"/>
  <path d="M300 80 L300 220" stroke="#2b6cb0" stroke-width="3" marker-end="url(#c1)"/>
  <text x="360" y="70" font-family="sans-serif" font-size="12" fill="#1a4a7a" text-anchor="middle">Current running</text>
  <text x="360" y="240" font-family="sans-serif" font-size="12" fill="#1a4a7a" text-anchor="middle">along the dock</text>
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <text x="150" y="240" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Bow into the current, let current help hold position</text>
</svg>
