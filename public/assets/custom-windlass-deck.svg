<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Top-down view of a foredeck windlass with a gypsy wheel for chain, a rode leading forward over the bow roller, and a control switch nearby">
  <rect width="420" height="260" fill="#e8e2d5"/>
  <ellipse cx="210" cy="140" rx="180" ry="100" fill="#f3ede2" stroke="#999" stroke-width="1"/>
  <circle cx="210" cy="130" r="34" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
  <circle cx="210" cy="130" r="14" fill="#5a5a5a" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="180" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Gypsy wheel (chain wheel)</text>
  <rect x="270" y="120" width="26" height="20" rx="3" fill="#c05621" stroke="#333" stroke-width="1.5"/>
  <text x="283" y="160" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Up/down control switch</text>
  <path d="M210 96 L210 40" stroke="#5a4a35" stroke-width="4"/>
