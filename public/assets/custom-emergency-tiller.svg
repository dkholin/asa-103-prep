<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Diagram of the emergency tiller fitted onto the exposed head of the rudder post through a cockpit locker access hatch, bypassing the wheel steering" >
  <rect width="420" height="260" fill="#dcebf5"/>
  <rect x="40" y="60" width="340" height="160" fill="#e8e2d5" stroke="#444" stroke-width="2"/>
  <text x="210" y="50" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Cockpit sole / lazarette</text>
  <rect x="180" y="90" width="60" height="45" fill="#c9c2b0" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="210" y="85" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Locker access hatch</text>
  <circle cx="210" cy="140" r="10" fill="#5a5a5a" stroke="#333" stroke-width="2"/>
  <text x="270" y="145" font-family="sans-serif" font-size="12" fill="#333">Rudder post head</text>
  <line x1="210" y1="140" x2="130" y2="185" stroke="#c05621" stroke-width="7"/>
  <text x="110" y="205" font-family="sans-serif" font-size="12" fill="#c05621" text-anchor="middle">Emergency tiller</text>
  <text x="110" y="220" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">(fits over post if wheel steering fails)</text>
</svg>
