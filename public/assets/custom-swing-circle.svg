<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="Bird's-eye view of a boat at anchor with a dashed circle showing the full swing radius equal to the scoped rode length, a moored boat encroaching on the edge of that circle, and a charted rock just outside it" >
  <rect width="420" height="320" fill="#dcebf5"/>
  <!-- swing circle -->
  <circle cx="210" cy="160" r="110" fill="#cfe4f2" opacity="0.6" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- anchor at center -->
  <g transform="translate(210 160)">
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <line x1="0" y1="4" x2="0" y2="18" stroke="#333" stroke-width="2"/>
    <path d="M-9 18 Q0 27 9 18" fill="none" stroke="#333" stroke-width="2"/>
  </g>
  <text x="210" y="145" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Anchor</text>
  <!-- own boat near edge of circle, drifting with wind/current -->
  <g transform="translate(210 70)">
    <path d="M-16 0 L16 0 L11 16 L-11 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
  </g>
  <text x="210" y="50" font-family="sans-serif" font-size="13" fill="#1a3d5c" text-anchor="middle">Your boat</text>
  <text x="210" y="105" font-family="sans-serif" font-size="11" fill="#1a3d5c" text-anchor="middle">radius = scope × (depth + bow height)</text>
  <!-- another moored boat, well within the circle's outer edge -->
  <g transform="translate(298 188)">
    <path d="M-14 0 L14 0 L10 14 L-10 14 Z" fill="#c05621" stroke="#8a3c12" stroke-width="2"/>
  </g>
  <text x="298" y="221" font-family="sans-serif" font-size="12" fill="#6b3410" text-anchor="middle">Neighboring boat</text>
  <!-- charted rock just outside the swing circle -->
  <g transform="translate(70 260)">
    <polygon points="0,-8 8,4 -8,4" fill="#5a4a35"/>
  </g>
  <text x="70" y="283" font-family="sans-serif" font-size="12" fill="#5a4a35" text-anchor="middle">Charted rock</text>
</svg>
