  <rect width="420" height="320" fill="#edf6fa"/>

  <!-- Dashed swing limit ring, radius 112 from the anchor at (205,164): styled with the canonical swing-circle dash treatment -->
  <circle cx="205" cy="164" r="112" fill="#cfe5f1" fill-opacity=".35"/>
  <use href="#swing-circle-dash" x="93" y="59.34" width="224" height="209.33"/>
  <rect x="134" y="50" width="142" height="24" rx="12" fill="#fff" stroke="#cbdbe6"/><text x="205" y="67" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#133f68">expected swing limit</text>

  <!-- Radius indicator: deterministic line from the anchor to the ring edge, independent of the canonical dash symbol -->
  <path d="M205 164 302 108" stroke="#52697c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#radius-head)"/>
  <text x="266" y="123" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#52697c">R</text>

  <!-- Anchor at the circle's center -->
  <use href="#anchor" x="194" y="148" width="22" height="32.03"/>
  <text x="205" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#384956">anchor</text>

  <!-- Own vessel, resting near the top of its swing arc (72 units from the anchor, inside its own circle) -->
  <use href="#sailboat-top" x="191.18" y="62" width="27.64" height="60"/>

  <!-- Neighboring boat: center is 90 units from the anchor — inside the 112-unit swing radius -->
  <g transform="rotate(35 287 201)"><use href="#powerboat-top" x="277.88" y="175" width="18.24" height="52"/></g>
  <rect x="228" y="228" width="118" height="24" rx="12" fill="#fff" stroke="#cbdbe6"/><text x="287" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7c3f18">neighboring boat</text>

  <!-- Charted rock: center is 128 units from the anchor — just outside the 112-unit swing radius -->
  <use href="#rock-hazard" x="98" y="241.01" width="34" height="27.98"/>
  <text x="115" y="289" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5037">charted rock</text>
</svg>
