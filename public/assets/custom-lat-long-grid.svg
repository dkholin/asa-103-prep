<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-label="Chart border excerpt showing latitude tick marks on the side borders and longitude tick marks on the top and bottom borders, with a charted position marked by a small circle">
  <rect width="460" height="380" fill="#eef5fa"/>
  <!-- chart interior -->
  <rect x="70" y="50" width="330" height="280" fill="#f7fbfd" stroke="#1a3d5c" stroke-width="2"/>
  <!-- longitude ticks: top and bottom borders -->
  <g stroke="#1a3d5c" stroke-width="1.5">
    <line x1="70" y1="50" x2="70" y2="38"/>
    <line x1="153" y1="50" x2="153" y2="38"/>
    <line x1="236" y1="50" x2="236" y2="38"/>
    <line x1="319" y1="50" x2="319" y2="38"/>
    <line x1="400" y1="50" x2="400" y2="38"/>
    <line x1="70" y1="330" x2="70" y2="342"/>
    <line x1="153" y1="330" x2="153" y2="342"/>
    <line x1="236" y1="330" x2="236" y2="342"/>
    <line x1="319" y1="330" x2="319" y2="342"/>
    <line x1="400" y1="330" x2="400" y2="342"/>
  </g>
  <text x="70" y="30" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">71°21'W</text>
  <text x="153" y="30" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">71°20'W</text>
  <text x="236" y="30" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">71°19'W</text>
  <text x="319" y="30" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">71°18'W</text>
  <text x="400" y="30" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">71°17'W</text>
  <!-- latitude ticks: left and right borders -->
  <g stroke="#1a3d5c" stroke-width="1.5">
    <line x1="70" y1="50" x2="58" y2="50"/>
    <line x1="70" y1="120" x2="58" y2="120"/>
    <line x1="70" y1="190" x2="58" y2="190"/>
    <line x1="70" y1="260" x2="58" y2="260"/>
    <line x1="70" y1="330" x2="58" y2="330"/>
    <line x1="400" y1="50" x2="412" y2="50"/>
    <line x1="400" y1="120" x2="412" y2="120"/>
    <line x1="400" y1="190" x2="412" y2="190"/>
    <line x1="400" y1="260" x2="412" y2="260"/>
    <line x1="400" y1="330" x2="412" y2="330"/>
  </g>
  <text x="50" y="54" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="end">41°27'N</text>
  <text x="50" y="124" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="end">41°26'N</text>
  <text x="50" y="194" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="end">41°25'N</text>
  <text x="50" y="264" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="end">41°24'N</text>
  <text x="50" y="334" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="end">41°23'N</text>
  <!-- light gridlines at the labelled ticks -->
  <g stroke="#c3d8e6" stroke-width="1">
    <line x1="70" y1="120" x2="400" y2="120"/>
    <line x1="70" y1="190" x2="400" y2="190"/>
    <line x1="70" y1="260" x2="400" y2="260"/>
    <line x1="153" y1="50" x2="153" y2="330"/>
    <line x1="236" y1="50" x2="236" y2="330"/>
    <line x1="319" y1="50" x2="319" y2="330"/>
  </g>
  <!-- marked position -->
  <circle cx="236" cy="190" r="6" fill="#c0392b" stroke="#7a2318" stroke-width="2"/>
  <text x="236" y="172" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a2318" text-anchor="middle">X</text>
</svg>
