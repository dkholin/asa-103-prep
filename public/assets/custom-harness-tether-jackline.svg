<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Overhead view of a sailboat deck showing jacklines running fore and aft along the side decks, a crew member wearing a harness clipped to the jackline with a tether, kept inboard away from the rail">
  <rect width="420" height="260" fill="#dcebf5"/>
  <path d="M60 40 L360 40 L380 220 L40 220 Z" fill="#e8e2d5" stroke="#444" stroke-width="2"/>
  <line x1="80" y1="55" x2="65" y2="205" stroke="#c05621" stroke-width="3" stroke-dasharray="10 4"/>
  <line x1="340" y1="55" x2="355" y2="205" stroke="#c05621" stroke-width="3" stroke-dasharray="10 4"/>
  <text x="80" y="45" font-family="sans-serif" font-size="11" fill="#8a3c12" text-anchor="middle">Jackline</text>
  <text x="340" y="45" font-family="sans-serif" font-size="11" fill="#8a3c12" text-anchor="middle">Jackline</text>
  <circle cx="200" cy="130" r="14" fill="#333"/>
  <text x="200" y="115" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Crew wearing harness</text>
  <line x1="200" y1="130" x2="180" y2="160" stroke="#c05621" stroke-width="3"/>
  <text x="150" y="180" font-family="sans-serif" font-size="11" fill="#8a3c12">Tether clipped to jackline</text>
  <text x="210" y="150" font-family="sans-serif" font-size="11" fill="#555">kept inboard, away from rail</text>
</svg>
