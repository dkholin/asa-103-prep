<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Cross-section of a hull below the waterline showing a through-hull fitting, a seacock valve on the inside, and a hose clamped to the seacock leading to a sink drain">
  <rect width="420" height="260" fill="#f3ede2"/>
  <rect x="0" y="120" width="420" height="140" fill="#a7cbe0"/>
  <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#1a4a7a">Above waterline</text>
  <text x="20" y="140" font-family="sans-serif" font-size="12" fill="#1a4a7a">Below waterline</text>
  <path d="M170 40 L170 260" stroke="#5a5a5a" stroke-width="14"/>
  <text x="130" y="60" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">Hull</text>
  <circle cx="170" cy="180" r="12" fill="#333"/>
  <text x="200" y="200" font-family="sans-serif" font-size="12" fill="#333">Through-hull fitting</text>
  <rect x="176" y="165" width="60" height="30" rx="5" fill="#c05621" stroke="#333" stroke-width="2"/>
  <text x="280" y="160" font-family="sans-serif" font-size="13" fill="#333">Seacock (shutoff valve)</text>
  <path d="M236 180 Q280 180 300 180" stroke="#5a5a5a" stroke-width="10" fill="none"/>
  <text x="330" y="185" font-family="sans-serif" font-size="12" fill="#333">Hose, double-clamped</text>
  <text x="330" y="205" font-family="sans-serif" font-size="12" fill="#333">to sink/head drain</text>
</svg>
