  <rect width="480" height="280" fill="#edf6fa"/>

  <!-- Wind, blowing from the top of the frame (upwind) down toward the bottom (downwind) -->
  <text x="38" y="25" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52697c">WIND</text>
  <g transform="translate(35 65) rotate(90)"><use href="#wind-arrow" x="-27.5" y="-4.57" width="55" height="9.14"/></g>
  <g transform="translate(67 65) rotate(90)"><use href="#wind-arrow" x="-27.5" y="-4.57" width="55" height="9.14"/></g>

  <!-- Return track: a curving turn away and back, ending on a close reach heading up toward the wind for the final approach -->
  <path d="M90,70 C210,20 340,60 350,130 C356,168 320,195 300,150" fill="none" stroke="#1d5c94" stroke-width="4" stroke-dasharray="9 6"/>

  <!-- Initial boat position/heading, before the turn back -->
  <g transform="translate(90 70) rotate(100)" opacity="0.72"><use href="#sailboat-top" x="-13.82" y="-30" width="27.64" height="60"/></g>

  <!-- Final approach: boat heading up toward the wind (close reach), stopped under way with the person alongside the downwind (leeward) side -->
  <g transform="translate(300 150) rotate(15)"><use href="#sailboat-top" x="-16.13" y="-35" width="32.25" height="70"/></g>

  <!-- Person in the water, alongside the boat's downwind (leeward) side -->
  <circle cx="333" cy="159" r="14" fill="none" stroke="#b85f24" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="333" cy="159" r="7" fill="#b85f24" stroke="#7c3f18" stroke-width="2"/>
  <rect x="271" y="190" width="124" height="24" rx="12" fill="#fff" stroke="#e2b994"/>
  <text x="333" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#7c3f18">person in water</text>
</svg>
