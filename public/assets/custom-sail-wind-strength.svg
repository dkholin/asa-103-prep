<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" role="img" aria-label="Three boats shown side by side under increasing wind strength: light air with full sail and no heel, moderate wind with full sail and moderate heel, and strong wind with a reefed mainsail and smaller headsail with reduced heel">
  <rect width="460" height="240" fill="#eef5fa"/>
  <line x1="153" y1="10" x2="153" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="307" y1="10" x2="307" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- light air -->
  <g transform="translate(76 180)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -70 L26 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="76" y="18" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle" font-weight="bold">Light air (~5 kt)</text>
  <text x="76" y="34" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Full main + genoa,</text>
  <text x="76" y="48" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">upright, little heel</text>

  <!-- moderate -->
  <g transform="translate(230 180) rotate(-14)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -70 L26 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="230" y="18" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle" font-weight="bold">Moderate (~14 kt)</text>
  <text x="230" y="34" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Full main + genoa,</text>
  <text x="230" y="48" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">moderate, steady heel</text>

  <!-- strong -->
  <g transform="translate(384 180) rotate(-9)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -46 L18 -6 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="1.5"/>
    <path d="M0 -46 L0 -6 L14 -6 Z" fill="#c9dcea" stroke="#888" stroke-dasharray="2 2" opacity="0.5"/>
    <path d="M-2 2 L-16 -30 L4 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-46" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="384" y="18" font-family="sans-serif" font-size="12" fill="#7a1f1f" text-anchor="middle" font-weight="bold">Strong (~24+ kt)</text>
  <text x="384" y="34" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Reefed main + smaller jib,</text>
  <text x="384" y="48" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">sail area reduced early</text>
</svg>
