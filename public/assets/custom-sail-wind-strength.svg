<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" role="img" aria-label="Three sailboat views under light, moderate, and strong wind headings.">
  <rect width="460" height="240" fill="#eef5fa"/>
  <line x1="153" y1="10" x2="153" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="307" y1="10" x2="307" y2="230" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- light air: full main and full headsail -->
  <g transform="translate(76 180)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -70 L26 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <path d="M-2 2 L-23 -46 L4 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="76" y="24" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle" font-weight="bold">LIGHT</text>

  <!-- moderate: main and headsail both shortened from the light-air plan -->
  <g transform="translate(230 180) rotate(-14)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -58 L21 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <path d="M-2 2 L-19 -38 L4 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-58" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="230" y="24" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle" font-weight="bold">MODERATE</text>

  <!-- strong -->
  <g transform="translate(384 180) rotate(-9)">
    <path d="M-30 0 L30 0 L22 16 L-22 16 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -46 L18 -6 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="1.5"/>
    <path d="M0 -46 L0 -6 L14 -6 Z" fill="#c9dcea" stroke="#888" stroke-dasharray="2 2" opacity="0.5"/>
    <path d="M-2 2 L-16 -30 L4 -6 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-46" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <text x="384" y="24" font-family="sans-serif" font-size="12" fill="#7a1f1f" text-anchor="middle" font-weight="bold">STRONG</text>
</svg>
