<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Night-water scene with one low green light visible.">
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="300" fill="#050a14"/>
  <!-- faint stars -->
  <g fill="#cbd5e1" opacity="0.5">
    <circle cx="60" cy="40" r="1.2"/><circle cx="150" cy="66" r="1"/><circle cx="240" cy="30" r="1.3"/>
    <circle cx="330" cy="55" r="1"/><circle cx="390" cy="90" r="1.1"/><circle cx="100" cy="100" r="0.9"/>
  </g>
  <!-- horizon -->
  <line x1="0" y1="190" x2="420" y2="190" stroke="#101b2e" stroke-width="2"/>
  <rect y="190" width="420" height="110" fill="#070e1c"/>
  <!-- the single green light -->
  <circle cx="210" cy="176" r="26" fill="url(#greenGlow)"/>
  <circle cx="210" cy="176" r="5" fill="#86efac"/>
  <!-- faint reflection -->
  <ellipse cx="210" cy="204" rx="18" ry="4" fill="#14532d" opacity="0.6"/>
</svg>
