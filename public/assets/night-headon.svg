  <defs>
    <radialGradient id="wGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#e2e8f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#16a34a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
