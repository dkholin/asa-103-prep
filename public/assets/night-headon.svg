<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Night scene at sea: a white masthead light with a green light below it to the left and a red light below it to the right, seen dead ahead">
  <defs>
    <radialGradient id="wGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="300" fill="#050a14"/>
  <g fill="#cbd5e1" opacity="0.5">
    <circle cx="70" cy="46" r="1.1"/><circle cx="170" cy="28" r="1"/><circle cx="260" cy="52" r="1.2"/>
    <circle cx="350" cy="34" r="1"/><circle cx="40" cy="90" r="0.9"/><circle cx="386" cy="80" r="1"/>
  </g>
  <line x1="0" y1="195" x2="420" y2="195" stroke="#101b2e" stroke-width="2"/>
  <rect y="195" width="420" height="105" fill="#070e1c"/>
  <!-- white masthead light above -->
  <circle cx="210" cy="120" r="22" fill="url(#wGlow)"/>
  <circle cx="210" cy="120" r="4.5" fill="#ffffff"/>
  <!-- green sidelight (their starboard, appears on your left) -->
  <circle cx="176" cy="172" r="20" fill="url(#gGlow)"/>
  <circle cx="176" cy="172" r="4.5" fill="#86efac"/>
  <!-- red sidelight (their port, appears on your right) -->
  <circle cx="244" cy="172" r="20" fill="url(#rGlow)"/>
  <circle cx="244" cy="172" r="4.5" fill="#fca5a5"/>
  <ellipse cx="210" cy="208" rx="24" ry="4" fill="#1e293b" opacity="0.7"/>
</svg>
