  <!-- white masthead light above -->
  <circle cx="210" cy="120" r="24" fill="url(#wGlow)"/>
  <use href="#nav-light-white" x="201" y="111" width="18" height="18"/>

  <!-- green sidelight (their starboard, appears on your left) -->
  <circle cx="176" cy="172" r="22" fill="url(#gGlow)"/>
  <use href="#nav-light-green" x="167" y="163" width="18" height="18"/>

  <!-- red sidelight (their port, appears on your right) -->
