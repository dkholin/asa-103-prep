<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Cockpit binnacle with a steering wheel and a mounted magnetic compass on top, with the compass card and lubber line labeled">
  <rect width="420" height="260" fill="#dcebf5"/>
  <circle cx="210" cy="150" r="80" fill="none" stroke="#5a5a5a" stroke-width="10"/>
  <rect x="195" y="150" width="30" height="80" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
  <text x="210" y="245" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Binnacle pedestal</text>
  <circle cx="210" cy="150" r="10" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
  <text x="120" y="150" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Steering wheel</text>
  <g transform="translate(210 90)">
    <circle cx="0" cy="0" r="34" fill="#f3ede2" stroke="#333" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#c05621" stroke-width="2"/>
    <text x="0" y="-24" font-family="sans-serif" font-size="10" fill="#c05621" text-anchor="middle">N</text>
    <line x1="0" y1="-36" x2="0" y2="-56" stroke="#333" stroke-width="2"/>
  </g>
  <text x="290" y="80" font-family="sans-serif" font-size="12" fill="#333">Compass card</text>
  <text x="290" y="112" font-family="sans-serif" font-size="12" fill="#333">Lubber line</text>
  <text x="290" y="127" font-family="sans-serif" font-size="11" fill="#555">(boat's heading)</text>
</svg>
