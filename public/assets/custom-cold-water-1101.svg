<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Three-point cold-water timeline marked at about 1 minute, 10 minutes, and 1 hour.">
  <rect width="480" height="220" fill="#eef5fa"/>
  <text x="240" y="27" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a3d5c" text-anchor="middle">COLD-WATER IMMERSION TIMELINE</text>
  <line x1="55" y1="132" x2="425" y2="132" stroke="#2b6cb0" stroke-width="4"/>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="75" cy="132" r="9" fill="#1a4a7a"/><text x="75" y="62" font-size="14" font-weight="700" fill="#7a1f1f">~1 minute</text><text x="75" y="155" font-size="11" fill="#52697c">STAGE A</text>
    <circle cx="245" cy="132" r="9" fill="#1a4a7a"/><text x="245" y="62" font-size="14" font-weight="700" fill="#7a1f1f">~10 minutes</text><text x="245" y="155" font-size="11" fill="#52697c">STAGE B</text>
    <circle cx="405" cy="132" r="9" fill="#1a4a7a"/><text x="405" y="62" font-size="14" font-weight="700" fill="#7a1f1f">~1 hour</text><text x="405" y="155" font-size="11" fill="#52697c">STAGE C</text>
  </g>
  <g transform="translate(75 94)" fill="none" stroke="#52697c" stroke-width="2"><circle cy="-12" r="8"/><path d="M0-4V22M-15 8H15"/></g>
  <g transform="translate(245 94)" fill="none" stroke="#52697c" stroke-width="2"><circle cy="-12" r="8"/><path d="M0-4V22M-15 8H15"/></g>
  <g transform="translate(405 94)" fill="none" stroke="#52697c" stroke-width="2" opacity=".6"><circle cy="-12" r="8"/><path d="M0-4V22M-15 8H15"/></g>
  <text x="240" y="202" font-family="sans-serif" font-size="11" fill="#52697c" text-anchor="middle">approximate stages; individual conditions vary</text>
</svg>
