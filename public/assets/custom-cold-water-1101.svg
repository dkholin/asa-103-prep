<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Diagram of the 1-10-1 cold water immersion timeline: 1 minute to control cold shock and breathing, 10 minutes of meaningful movement before muscles weaken, 1 hour before unconsciousness from hypothermia">
  <rect width="480" height="220" fill="#eef5fa"/>
  <text x="240" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a3d5c" text-anchor="middle">Cold water immersion: the 1-10-1 timeline</text>
  <line x1="40" y1="120" x2="440" y2="120" stroke="#2b6cb0" stroke-width="3"/>
  <circle cx="70" cy="120" r="7" fill="#1a4a7a"/>
  <circle cx="255" cy="120" r="7" fill="#1a4a7a"/>
  <circle cx="410" cy="120" r="7" fill="#1a4a7a"/>

  <g>
    <text x="70" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">~1 minute</text>
    <text x="70" y="90" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Cold shock:</text>
    <text x="70" y="105" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">gasping, control</text>
    <text x="70" y="150" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">your breathing,</text>
    <text x="70" y="165" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">don't submerge</text>
  </g>

  <g>
    <text x="255" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">~10 minutes</text>
    <text x="255" y="90" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Cold incapacitation:</text>
    <text x="255" y="105" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">muscles/hands weaken,</text>
    <text x="255" y="150" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">swim failure risk —</text>
    <text x="255" y="165" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">a life jacket is critical</text>
  </g>

  <g>
    <text x="410" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">~1 hour</text>
    <text x="410" y="90" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Hypothermia:</text>
    <text x="410" y="105" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">core cooling can lead</text>
    <text x="410" y="150" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">to unconsciousness —</text>
    <text x="410" y="165" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">many drown before this</text>
  </g>
  <text x="240" y="200" font-family="sans-serif" font-size="11" fill="#1a3d5c" text-anchor="middle">Approximate, illustrative stages — not exact thresholds for every person or water temperature</text>
</svg>
