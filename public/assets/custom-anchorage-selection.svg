  <g clip-path="url(#landClipBottom)"><use href="#shoreline" x="120" y="255" width="220" height="153.9"/></g>

  <!-- Wind, blowing from the top of the chart straight down the open bay mouth -->
  <text x="330" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52697c">WIND</text>
  <g transform="translate(280 62) rotate(90)"><use href="#wind-arrow" x="-32" y="-5.32" width="64" height="10.64"/></g>
  <g transform="translate(330 62) rotate(90)"><use href="#wind-arrow" x="-32" y="-5.32" width="64" height="10.64"/></g>
  <g transform="translate(380 62) rotate(90)"><use href="#wind-arrow" x="-32" y="-5.32" width="64" height="10.64"/></g>

  <!-- Spot A: open near the bay mouth, directly exposed to wind and fetch -->
  <use href="#label-a" x="319" y="121" width="22" height="22"/>

  <!-- Spot B: tucked behind the point of land, in its wind shadow with a much shorter fetch -->
  <use href="#label-b" x="170" y="223" width="22" height="22"/>

  <text x="230" y="301" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f5c36">land and point forming the bay</text>
