<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 38 330 280" role="img" aria-label="Line diagram of one continuous rope tied in a figure-eight stopper knot. The standing part runs out to the left, the rope doubles back on itself through four alternating over-and-under crossings to form the two interlocking lobes of a figure eight, and a long free tail leaves the finished knot at the lower right.">
  <!--
    Project-original geometry, constructed from the tying sequence rather than
    traced from any published illustration.

    Rope path (Animated Knots by Grog, Figure 8 Knot; sailboat-cruising.com,
    Figure of 8 Knot): the tail passes over itself to form a loop, continues
    under and around the standing part, then back down through that loop.

    The drawn curve is checked numerically by the generator, not by eye. It has
    exactly 4 self-crossings, is strictly alternating, and no crossing occupies
    two consecutive positions along the strand, so the diagram is reduced (no
    removable kink). Its Gauss code is

        O1 U2 O3 U4 O2 U1 O4 U3

    A reduced alternating diagram is minimal, and the only knot of crossing
    number 4 is the figure-eight, 4_1. The base point and labelling differ from
    the usual textbook presentation of 4_1, so the generator also checks the
    invariant that distinguishes it: the interlacement graph of the chord
    diagram is a 4-cycle, every crossing interleaving exactly two of the other
    three. An overhand knot would reduce to 3 crossings; a bowline or any eye
    knot would leave a fixed loop standing clear of the knot, which this
    diagram does not.
  -->
