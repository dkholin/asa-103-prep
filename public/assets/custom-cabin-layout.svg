<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Top-down floor plan of a small cruising sailboat interior showing the V-berth forward, head, saloon settees and table amidships, galley to one side, companionway steps, and the cockpit aft">
  <rect width="460" height="260" fill="#f3ede2"/>
  <path d="M40 130 L140 40 L420 40 L420 220 L140 220 Z" fill="#fff" stroke="#444" stroke-width="2"/>
  <path d="M40 130 L140 40 L140 220 Z" fill="#e8e2d5" stroke="#444" stroke-width="2"/>
  <text x="90" y="130" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">V-berth</text>
  <rect x="150" y="50" width="50" height="45" fill="#dcebf5" stroke="#444" stroke-width="1.5"/>
  <text x="175" y="72" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Head</text>
  <rect x="215" y="60" width="120" height="120" fill="#eef2e6" stroke="#444" stroke-width="1.5"/>
  <text x="275" y="125" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Saloon</text>
  <text x="275" y="140" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">(settees + table)</text>
  <rect x="345" y="60" width="55" height="120" fill="#f5e6cf" stroke="#444" stroke-width="1.5"/>
  <text x="372" y="120" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Galley</text>
  <rect x="215" y="190" width="60" height="25" fill="#d9d9d9" stroke="#444" stroke-width="1.5"/>
  <text x="245" y="207" font-family="sans-serif" font-size="10" fill="#333" text-anchor="middle">Companionway</text>
  <text x="245" y="240" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">up to cockpit / on deck</text>
</svg>
