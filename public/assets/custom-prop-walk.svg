<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Bird's-eye view of a boat backing down with a right-hand propeller in reverse, showing the stern walking to port while the boat moves astern">
  <rect width="420" height="260" fill="#dcebf5"/>
  <g transform="translate(230 150)">
    <path d="M-70 -18 L60 -18 L80 0 L60 18 L-70 18 Z" fill="#c9c2b0" stroke="#333" stroke-width="2"/>
  </g>
  <text x="300" y="130" font-family="sans-serif" font-size="12" fill="#333">Bow</text>
  <path d="M160 132 Q100 90 60 90" stroke="#2b6cb0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="60" y="80" font-family="sans-serif" font-size="12" fill="#1a4a7a">Stern walks to port</text>
  <path d="M230 150 L120 150" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
  <text x="125" y="190" font-family="sans-serif" font-size="12" fill="#333">Boat moves astern</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="210" y="230" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Right-hand prop, reverse gear (prop walk)</text>
</svg>
