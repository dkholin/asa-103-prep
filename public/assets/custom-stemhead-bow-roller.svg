<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Side view of a sailboat bow showing the stemhead fitting with bow roller at the top of the stem, anchor rode running over the roller down to an anchor stowed on deck">
  <rect width="420" height="260" fill="#dcebf5"/>
  <path d="M40 220 L160 60 L400 60 L400 220 Z" fill="#e8e2d5" stroke="#444" stroke-width="2"/>
  <text x="230" y="240" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Hull / deck (side view)</text>
  <g transform="translate(160 60)">
    <rect x="-14" y="-18" width="28" height="26" rx="4" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="-5" r="7" fill="#c9c2b0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="60" y="35" font-family="sans-serif" font-size="13" fill="#333">Stemhead fitting</text>
  <line x1="90" y1="40" x2="150" y2="55" stroke="#333" stroke-width="1"/>
  <text x="255" y="35" font-family="sans-serif" font-size="13" fill="#333">Bow roller</text>
  <line x1="250" y1="40" x2="170" y2="52" stroke="#333" stroke-width="1"/>
  <path d="M166 58 Q120 110 130 170" fill="none" stroke="#5a4a35" stroke-width="3"/>
  <text x="110" y="130" font-family="sans-serif" font-size="12" fill="#5a4a35">Anchor rode</text>
  <g transform="translate(135 185)">
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <line x1="0" y1="4" x2="0" y2="16" stroke="#333" stroke-width="2"/>
    <path d="M-8 16 Q0 24 8 16" fill="none" stroke="#333" stroke-width="2"/>
  </g>
  <text x="135" y="215" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Anchor stowed on bow</text>
</svg>
