  <rect x="33" y="239" width="174" height="30" rx="15" fill="#fff" stroke="#cbdbe6"/><text x="120" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#133f68">A · wind on port side</text>
