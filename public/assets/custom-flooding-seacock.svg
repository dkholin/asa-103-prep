<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" role="img" aria-label="Hull cutaway with a below-waterline leak and nearby emergency equipment." fill="none">
  <rect width="460" height="240" fill="#eef5fa"/>
  <text x="230" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a3d5c" text-anchor="middle">BELOW-WATERLINE LEAK SCENARIO</text>

  <!-- hull cutaway -->
  <path d="M20 60 L440 60 L440 200 Q230 230 20 200 Z" fill="#f7f2e7" stroke="#5a4632" stroke-width="3"/>
  <rect x="20" y="130" width="420" height="90" fill="#9fc2d9" opacity="0.85"/>
  <text x="60" y="122" font-family="sans-serif" font-size="10" fill="#1a3d5c">Waterline</text>
  <line x1="20" y1="130" x2="440" y2="130" stroke="#1a4a7a" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- through hull + seacock -->
  <g transform="translate(210 150)">
    <rect x="-10" y="-10" width="20" height="20" fill="#777" stroke="#333" stroke-width="1.5"/>
    <rect x="-45" y="-6" width="35" height="12" fill="#666" stroke="#333" stroke-width="1.5"/>
    <rect x="10" y="-6" width="55" height="12" fill="#b08968" stroke="#5a4632" stroke-width="1.5"/>
    <!-- clamp -->
    <rect x="55" y="-9" width="6" height="18" fill="#999" stroke="#333" stroke-width="1"/>
    <!-- spray -->
    <g stroke="#2b6cb0" stroke-width="2">
      <line x1="61" y1="-3" x2="80" y2="-16"/>
      <line x1="61" y1="0" x2="82" y2="-2"/>
      <line x1="61" y1="4" x2="80" y2="16"/>
    </g>
    <text x="100" y="-10" font-family="sans-serif" font-size="9" fill="#7a1f1f">Water spraying</text>
    <text x="100" y="2" font-family="sans-serif" font-size="9" fill="#7a1f1f">in at loose clamp</text>
  </g>

  <!-- bung and bucket -->
  <g transform="translate(340 175)">
    <polygon points="0,0 18,0 13,18 5,18" fill="#8a5a2e" stroke="#4a3018" stroke-width="1.5"/>
  </g>
  <g transform="translate(90 170)">
    <path d="M0 0 L28 0 L24 26 L4 26 Z" fill="#ccc" stroke="#333" stroke-width="1.5"/>
  </g>
</svg>
