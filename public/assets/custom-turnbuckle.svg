<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Diagram of a turnbuckle connecting a wire shroud above to a chainplate below, with the threaded barrel body and swaged terminal labeled">
  <rect width="420" height="260" fill="#f3ede2"/>
  <line x1="210" y1="10" x2="210" y2="60" stroke="#5a5a5a" stroke-width="4"/>
  <text x="270" y="35" font-family="sans-serif" font-size="13" fill="#333">Shroud (wire rigging)</text>
  <g transform="translate(210 60)">
    <path d="M-6 0 L6 0 L4 20 L-4 20 Z" fill="#8a8a8a" stroke="#444" stroke-width="1.5"/>
  </g>
  <text x="270" y="75" font-family="sans-serif" font-size="13" fill="#333">Swaged terminal</text>
  <rect x="192" y="80" width="36" height="70" rx="6" fill="#c9c2b0" stroke="#444" stroke-width="2"/>
  <line x1="210" y1="90" x2="210" y2="140" stroke="#444" stroke-width="1"/>
  <text x="270" y="120" font-family="sans-serif" font-size="13" fill="#333">Threaded barrel body</text>
  <text x="270" y="138" font-family="sans-serif" font-size="11" fill="#555">(rotate to adjust tension)</text>
  <line x1="210" y1="150" x2="210" y2="195" stroke="#5a5a5a" stroke-width="4"/>
  <rect x="198" y="195" width="24" height="14" fill="#8a8a8a" stroke="#444" stroke-width="1.5"/>
  <text x="270" y="205" font-family="sans-serif" font-size="13" fill="#333">Clevis pin</text>
  <path d="M195 209 L225 209 L218 240 L202 240 Z" fill="#b0aca0" stroke="#444" stroke-width="2"/>
  <text x="270" y="230" font-family="sans-serif" font-size="13" fill="#333">Chainplate</text>
  <line x1="210" y1="240" x2="210" y2="255" stroke="#444" stroke-width="3"/>
  <text x="210" y="20" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle"></text>
</svg>
