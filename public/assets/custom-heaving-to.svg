  <rect width="400" height="330" fill="#edf6fa"/>

  <text x="72" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#52697c">WIND</text>
  <g transform="translate(30 72) rotate(90)"><use href="#wind-arrow" x="-28" y="-4.65" width="56" height="9.3"/></g>
  <g transform="translate(72 72) rotate(90)"><use href="#wind-arrow" x="-28" y="-4.65" width="56" height="9.3"/></g>
  <g transform="translate(114 72) rotate(90)"><use href="#wind-arrow" x="-28" y="-4.65" width="56" height="9.3"/></g>

  <!-- Boat hove-to: backed headsail to windward, mainsail sheeted in, rudder deflected -->
  <g transform="translate(240 162) rotate(-50)">
    <path d="M0 86V132" stroke="#8297a8" stroke-width="2" stroke-dasharray="7 5"/>

    <!-- Canonical hull, scaled/positioned so bow is forward (negative local y) and stern aft (positive local y) -->
    <g transform="translate(0 -100) scale(0.43299) translate(-101.055 0)">
      <use href="#sailboat-top" width="202.11" height="438.78"/>
    </g>

    <!-- Mast and boom (deterministic geometry) -->
    <path d="M0-98 0-22" stroke="#0e3350" stroke-width="1.5"/>
    <path d="M0-22-20 70" stroke="#0e3350" stroke-width="4"/>
    <!-- Mainsail, sheeted in near the centerline (deterministic geometry) -->
    <path d="M0-22Q-56 24-20 70Q-8 24 0-22Z" fill="#fff" stroke="#0e3350" stroke-width="2"/>
    <!-- Headsail backed to windward (deterministic geometry) -->
    <path d="M0-96Q62-48 45-4Q28-50 0-96Z" fill="#f2bb86" stroke="#7c3f18" stroke-width="2"/>
    <circle cx="0" cy="-22" r="4" fill="#fff" stroke="#0e3350" stroke-width="2"/>

    <!-- Rudder blade deflected off the centerline (simple deterministic geometry) -->
    <path d="M6.1 82.5 20.5 113.4 13.5 117.4-6.1 89.5Z" fill="#384956" stroke="#22303a" stroke-width="1.5"/>
    <circle cx="0" cy="86" r="4.5" fill="#fff" stroke="#384956" stroke-width="2.5"/>
  </g>

  <g transform="translate(202 276) rotate(111.04)"><use href="#current-arrow" x="-28" y="-2.22" width="56" height="4.43"/></g>
  <text x="192" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#167d94">DRIFT</text>
</svg>
