<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Bird's-eye view of a sailboat hove-to: the jib backed to windward, the mainsail sheeted in, and the rudder turned to windward, with the boat lying nearly stationary and slowly drifting to leeward, making a slick" >
  <rect width="420" height="280" fill="#dcebf5"/>
  <g stroke="#456" stroke-width="3" fill="#456">
    <line x1="30" y1="50" x2="130" y2="50"/>
    <path d="M130 50 l-14 -8 v16 z"/>
    <line x1="30" y1="80" x2="140" y2="80"/>
    <path d="M140 80 l-14 -8 v16 z"/>
  </g>
  <text x="80" y="35" font-family="sans-serif" font-size="13" fill="#1a3d5c">Wind</text>

  <g transform="translate(230 150) rotate(15)">
    <path d="M-20 0 L20 0 L14 60 L-14 60 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <!-- backed jib to windward -->
    <path d="M-4 -6 L-70 20 L-4 40 Z" fill="#e08a3c" stroke="#8a4a10" stroke-width="1.5"/>
    <text x="-95" y="26" font-family="sans-serif" font-size="11" fill="#8a4a10">Jib backed</text>
    <!-- mainsail sheeted in tight -->
    <path d="M4 -4 L4 50 L26 30 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="10" y="70" font-family="sans-serif" font-size="11" fill="#1a3d5c">Main sheeted in</text>
    <!-- rudder to windward -->
    <line x1="0" y1="60" x2="-14" y2="78" stroke="#333" stroke-width="3"/>
    <text x="-60" y="90" font-family="sans-serif" font-size="11" fill="#333">Helm to windward</text>
  </g>

  <path d="M170 205 q-30 15 -60 8 q-30 -7 -55 5" fill="none" stroke="#7fa8c9" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="55" y="240" font-family="sans-serif" font-size="12" fill="#1a3d5c">Slow drift to leeward (a "slick")</text>
</svg>
