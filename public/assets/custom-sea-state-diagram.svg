<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Side view diagram comparing a calm sea with small ripples to a rough sea with steep, closely-spaced swells and whitecaps, with wave height labeled on each">
  <rect width="460" height="260" fill="#eef5fa"/>
  <text x="115" y="28" font-family="sans-serif" font-size="15" fill="#1a3d5c" text-anchor="middle" font-weight="bold">Calm / light chop</text>
  <text x="345" y="28" font-family="sans-serif" font-size="15" fill="#7a1f1f" text-anchor="middle" font-weight="bold">Building / rough seas</text>
  <line x1="230" y1="10" x2="230" y2="250" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- calm side -->
  <rect x="10" y="150" width="210" height="90" fill="#bcd9ec"/>
  <path d="M10 150 q13 -6 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="30" y1="150" x2="30" y2="120" stroke="#456" stroke-width="1.5"/>
  <line x1="60" y1="145" x2="60" y2="120" stroke="#456" stroke-width="1.5"/>
  <path d="M20 118 h20 M50 118 h20" stroke="#456" stroke-width="1.5"/>
  <text x="80" y="125" font-family="sans-serif" font-size="12" fill="#1a3d5c">~0.5–1 ft ripples</text>
  <g transform="translate(150 160)">
    <path d="M-22 6 L22 6 L15 22 L-15 22 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="-26" stroke="#2b6cb0" stroke-width="3"/>
  </g>
  <text x="115" y="230" font-family="sans-serif" font-size="12" fill="#1a3d5c" text-anchor="middle">Steady, level ride</text>

  <!-- rough side -->
  <rect x="240" y="150" width="210" height="90" fill="#9fc2d9"/>
  <path d="M240 165 q10 -30 20 0 t20 -0 t20 -0 t20 -0 t20 -0 t20 -0 t20 -0 t20 -0 t20 -0" fill="none" stroke="#1a4a7a" stroke-width="3"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="270" cy="140" r="3"/>
    <circle cx="310" cy="138" r="3"/>
    <circle cx="350" cy="140" r="3"/>
    <circle cx="390" cy="138" r="3"/>
  </g>
  <line x1="260" y1="165" x2="260" y2="105" stroke="#7a1f1f" stroke-width="1.5"/>
  <line x1="300" y1="140" x2="300" y2="105" stroke="#7a1f1f" stroke-width="1.5"/>
  <path d="M250 103 h20 M290 103 h20" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="330" y="110" font-family="sans-serif" font-size="12" fill="#7a1f1f">5–7+ ft, steep &amp; close</text>
  <g transform="translate(340 168) rotate(-8)">
    <path d="M-22 6 L22 6 L15 22 L-15 22 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="-26" stroke="#2b6cb0" stroke-width="3"/>
  </g>
  <text x="345" y="230" font-family="sans-serif" font-size="12" fill="#7a1f1f" text-anchor="middle">Pitching, spray, reduced control</text>
</svg>
