  <text x="210" y="27" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#7c3f18">Other vessel</text>
  <circle cx="210" cy="150" r="8" fill="#fff" stroke="#91a9ba" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="236" y="154" font-family="sans-serif" font-size="12" fill="#52697c">reciprocal courses</text>
