<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="Side-profile diagram of a cruising sailboat, bow to the left, with the bow, stem, hull, keel, rudder, transom, stern, deck, foredeck, coach roof, cockpit, companionway, mast and boom each labelled.">
  <title>Side profile of a cruising sailboat with its main external areas labelled</title>
  <rect width="680" height="420" fill="#f3ede2"/>

  <!-- Underwater appendages are drawn first so the hull fill, laid over their
       roots, makes keel and rudder read as attached rather than butted on.
       Keel: ballasted fin on the centreline, under the hull, forward of the rudder. -->
  <path d="M300 299 L362 299 L358 358 L322 360 Z" fill="#c9c2b0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Rudder: separate blade aft of the keel and forward of the transom, tip shallower than the keel. -->
  <path d="M462 296 L490 290 L484 342 L466 343 Z" fill="#c9c2b0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hull: fill first, then the outline in pieces. The deck line is drawn only
       where the deck is actually visible in profile - it stops at the coach roof
       and breaks open across the cockpit well instead of closing it into a box. -->
  <path d="M112 214 L560 232 L538 276 C 500 292, 430 300, 356 300 C 288 300, 214 296, 176 282 C 150 272, 120 248, 112 214 Z" fill="#e8e2d5"/>
  <g fill="none" stroke="#444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M112 214 L225 219"/>
    <path d="M424 227 L432 227"/>
    <path d="M520 230 L560 232"/>
    <path d="M560 232 L538 276"/>
    <path d="M538 276 C 500 292, 430 300, 356 300 C 288 300, 214 296, 176 282 C 150 272, 120 248, 112 214"/>
  </g>

  <!-- Coach roof (trunk cabin): raised structure standing on the deck amidships. -->
  <path d="M225 219 L250 178 L410 174 L424 227" fill="#efe9dc" stroke="#444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Companionway: the opening in the aft face of the coach roof, at the
       forward end of the cockpit, above a bridgedeck sill. -->
  <path d="M400 190 L414 190 L423 224 L400 224 Z" fill="#c9c2b0" stroke="#333" stroke-width="1.5"/>
  <g stroke="#8a8a8a" stroke-width="1.2">
    <line x1="401" y1="202" x2="418" y2="202"/>
    <line x1="401" y1="213" x2="421" y2="213"/>
  </g>

  <!-- Cockpit: recessed well aft of the coach roof, open at deck level. -->
  <path d="M432 227 L432 266 L520 266 L520 230 Z" fill="#f3ede2"/>
  <path d="M432 227 L432 266 L520 266 L520 230" fill="none" stroke="#444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Rig: orientation landmarks only, not a sail plan. -->
  <line x1="300" y1="177" x2="310" y2="18" stroke="#8a8a8a" stroke-width="6" stroke-linecap="round"/>
  <line x1="301" y1="157" x2="394" y2="148" stroke="#8a8a8a" stroke-width="5" stroke-linecap="round"/>

  <!-- Leader lines -->
  <g stroke="#555" stroke-width="1.4" fill="#555">
    <line x1="170" y1="88" x2="170" y2="216"/><circle cx="170" cy="216" r="3"/>
    <line x1="270" y1="88" x2="304" y2="116"/><circle cx="304" cy="116" r="3"/>
    <line x1="390" y1="88" x2="390" y2="150"/><circle cx="390" cy="150" r="3"/>
    <line x1="500" y1="88" x2="420" y2="198"/><circle cx="420" cy="198" r="3"/>
    <line x1="90" y1="196" x2="111" y2="212"/><circle cx="111" cy="212" r="3"/>
    <line x1="90" y1="258" x2="135" y2="252"/><circle cx="135" cy="252" r="3"/>
    <line x1="580" y1="192" x2="536" y2="231"/><circle cx="536" cy="231" r="3"/>
    <line x1="580" y1="238" x2="562" y2="233"/><circle cx="562" cy="233" r="3"/>
    <line x1="580" y1="282" x2="551" y2="258"/><circle cx="551" cy="258" r="3"/>
    <line x1="338" y1="382" x2="338" y2="361"/><circle cx="338" cy="361" r="3"/>
    <line x1="475" y1="382" x2="475" y2="345"/><circle cx="475" cy="345" r="3"/>
  </g>

  <!-- Labels -->
  <g font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2b2b2b">
    <text x="170" y="78" text-anchor="middle">Foredeck</text>
    <text x="270" y="78" text-anchor="middle">Mast</text>
    <text x="390" y="78" text-anchor="middle">Boom</text>
    <text x="500" y="78" text-anchor="middle">Companionway</text>
    <text x="86" y="200" text-anchor="end">Bow</text>
    <text x="86" y="262" text-anchor="end">Stem</text>
    <text x="584" y="196">Deck</text>
    <text x="584" y="242">Stern</text>
    <text x="584" y="286">Transom</text>
    <text x="338" y="402" text-anchor="middle">Keel</text>
    <text x="475" y="402" text-anchor="middle">Rudder</text>
    <text x="210" y="258" text-anchor="middle">Hull</text>
    <text x="476" y="251" text-anchor="middle" font-size="15">Cockpit</text>
    <text x="330" y="196" text-anchor="middle" font-size="16">Coach roof</text>
    <text x="330" y="214" text-anchor="middle" font-size="16">(trunk cabin)</text>
  </g>
</svg>
