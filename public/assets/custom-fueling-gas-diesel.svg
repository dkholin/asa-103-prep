<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Fueling dock scene showing crew closed hatches and ports, engine off, blower running before starting a gasoline engine, contrasted with a diesel fill where a blower is not required">
  <rect width="420" height="260" fill="#f3ede2"/>
  <rect x="30" y="60" width="160" height="140" fill="#e8e2d5" stroke="#444" stroke-width="2"/>
  <text x="110" y="50" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Gasoline fueling</text>
  <text x="110" y="90" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Hatches &amp; ports closed</text>
  <text x="110" y="110" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Engine off, no smoking</text>
  <text x="110" y="130" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Run blower 4+ min after</text>
  <text x="110" y="150" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">fueling, before starting</text>
  <text x="110" y="180" font-family="sans-serif" font-size="11" fill="#c05621" text-anchor="middle">Vapors sink and pool —</text>
  <text x="110" y="195" font-family="sans-serif" font-size="11" fill="#c05621" text-anchor="middle">explosion risk if trapped</text>
  <rect x="230" y="60" width="160" height="140" fill="#eef2e6" stroke="#444" stroke-width="2"/>
  <text x="310" y="50" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Diesel fueling</text>
  <text x="310" y="90" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Same care with spills</text>
  <text x="310" y="110" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">and closed fill cap</text>
  <text x="310" y="140" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Diesel vapor is far less</text>
  <text x="310" y="155" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">explosive than gasoline —</text>
  <text x="310" y="170" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">no engine-blower step</text>
  <text x="310" y="190" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">required before starting</text>
</svg>
