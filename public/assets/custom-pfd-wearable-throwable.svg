<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Side-by-side comparison of a wearable Type III PFD vest and a throwable Type IV horseshoe buoy with an attached line">
  <rect width="420" height="260" fill="#dcebf5"/>
  <g transform="translate(120 140)">
    <path d="M-45 -80 L45 -80 L55 60 L30 90 L-30 90 L-55 60 Z" fill="#f28c28" stroke="#333" stroke-width="3"/>
    <rect x="-45" y="-80" width="18" height="150" fill="#f28c28" stroke="#333" stroke-width="2"/>
    <rect x="27" y="-80" width="18" height="150" fill="#f28c28" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="-40" x2="20" y2="-40" stroke="#333" stroke-width="2"/>
  </g>
  <text x="120" y="235" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Wearable PFD (Type III)</text>
  <g transform="translate(300 140)">
    <path d="M0 -60 A60 60 0 1 1 -1 -60 M-40 -20 L-40 20 M40 -20 L40 20" fill="none" stroke="#c05621" stroke-width="22" stroke-dasharray="60 30" stroke-linecap="round"/>
    <line x1="-40" y1="20" x2="-70" y2="70" stroke="#333" stroke-width="2"/>
  </g>
  <text x="300" y="235" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">Throwable device (Type IV)</text>
  <text x="300" y="250" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">ring buoy / horseshoe with line</text>
</svg>
