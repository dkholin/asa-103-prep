  <!-- Rode: bow chock straight down to the anchor on the seabed (deterministic line, no rode primitive exists) -->
  <path d="M356 89 L56 248" stroke="#b85f24" stroke-width="4"/>
  <rect x="163" y="156" width="88" height="24" rx="12" fill="#fff" stroke="#e2b994"/><text x="207" y="173" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#7c3f18">rode L</text>

  <!-- Anchor at the seabed end of the rode -->
  <use href="#anchor" x="41" y="245" width="30" height="43.68"/>

  <!-- Depth (D): water surface down to the seabed, with the canonical depth-marker sounding line as a visual accent -->
  <path d="M48 145V266" stroke="#52697c" stroke-width="2" marker-start="url(#measure-head)" marker-end="url(#measure-head)"/>
  <use href="#depth-marker" x="24" y="150" width="16" height="26.3"/>
  <rect x="15" y="191" width="66" height="32" rx="8" fill="#fff" stroke="#cbdbe6"/><text x="48" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52697c">depth</text><text x="48" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#133f68">D = 10 ft</text>

  <!-- Bow height (H): water surface up to the bow chock -->
  <path d="M399 137V93" stroke="#52697c" stroke-width="2" marker-start="url(#measure-head)" marker-end="url(#measure-head)"/>
  <rect x="360" y="99" width="78" height="36" rx="8" fill="#fff" stroke="#cbdbe6"/><text x="399" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52697c">bow height</text><text x="399" y="129" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#133f68">H = 4 ft</text>

  <text x="230" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52697c">measure rode from bow chock to anchor</text>
