<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Front view of a sailboat heeling well over in a gust, compared to the same boat sailing flatter after easing the mainsheet and traveler, showing the reduced heel angle" >
  <rect width="420" height="260" fill="#eef5fa"/>
  <line x1="210" y1="0" x2="210" y2="260" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="100" y="24" font-family="sans-serif" font-size="13" fill="#7a1f1f" text-anchor="middle" font-weight="bold">Overpowered — sheeted hard</text>
  <text x="315" y="24" font-family="sans-serif" font-size="13" fill="#1a3d5c" text-anchor="middle" font-weight="bold">Eased sheet / traveler down</text>

  <!-- heeled boat -->
  <g transform="translate(100 190) rotate(-32)">
    <path d="M-40 0 L40 0 L28 22 L-28 22 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -95 L34 -8 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-95" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <path d="M40 210 h130" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="105" y="230" font-family="sans-serif" font-size="11" fill="#7a1f1f" text-anchor="middle">Large heel angle, rail down</text>

  <!-- flatter boat -->
  <g transform="translate(310 195) rotate(-10)">
    <path d="M-40 0 L40 0 L28 22 L-28 22 Z" fill="#2b6cb0" stroke="#1a4a7a" stroke-width="2"/>
    <path d="M0 0 L0 -95 L34 -8 Z" fill="#dce7ee" stroke="#2b6cb0" stroke-width="1.5"/>
    <line x1="0" y1="-95" x2="0" y2="0" stroke="#555" stroke-width="2"/>
  </g>
  <path d="M250 214 h130" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="315" y="234" font-family="sans-serif" font-size="11" fill="#1a3d5c" text-anchor="middle">Smaller heel angle, more control</text>
</svg>
