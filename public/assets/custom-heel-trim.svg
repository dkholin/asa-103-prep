      <path fill="#ffffff" d="M 619.939,518.403 C 625.572,518.454 627.401,518.087 626.066,524.234 C 619.081,525.043 619.864,524.75 619.939,518.403 Z"/>
    </symbol>

    <!-- Canonical primitive: sailboat-bow.svg (asa103-canonical-assets, approved).
         Inlined as a <g> rather than <use>d as a <symbol> because each panel needs
         translate(CX CY) rotate(THETA) scale(S) translate(-60 -30) - an anchored
         rotate+scale about the primitive's roll centre (60, 30), which
         <use x y width height> cannot express.
         The rig is added here in the primitive's own coordinate space, per the
         primitive's documented RIG CONSTRUCTION: half-beam B = 48, mast step
         (60, 12), masthead (60, 12 - 2.4*B) = (60, -103.2), mainsail clew
         (60 + 0.86*B, 12 - 0.2*B) = (101.28, 2.4).
         Both panels instantiate this SAME definition, so hull, rig and sail area
         are identical by construction; the ONLY difference between the panels is
         the heel angle in the transform. -->
    <g id="vessel">
      <g stroke="#133f68" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M50 42h20l-4 18h-12z" fill="#133f68"/>
        <path d="M12 12C14 26 26 40 44 42H76C94 40 106 26 108 12Z" fill="#1d5c94"/>
        <path d="M44 12h32l-4-9h-24z" fill="#cfe5f1"/>
      </g>
      <path d="M60 12V-103.2" stroke="#0e3350" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M60 12 60-103.2 101.28 2.4Z" fill="#fff" stroke="#0e3350" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="420" height="260" fill="#edf6fa"/>

  <!-- Common waterline datum at y = 208, drawn once across the whole frame so both
       panels sit on the identical water surface. -->
  <rect y="208" width="420" height="52" fill="#cfe5f1"/>
  <use href="#water-surface" x="0" y="203.67" width="105" height="8.67"/>
  <use href="#water-surface" x="105" y="203.67" width="105" height="8.67"/>
  <use href="#water-surface" x="210" y="203.67" width="105" height="8.67"/>
  <use href="#water-surface" x="315" y="203.67" width="105" height="8.67"/>
  <path d="M0 208H420" stroke="#1d5c94" stroke-width="2"/>

  <!-- Neutral panel divider -->
  <path d="M210 0V260" stroke="#a9c3d3" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Panel A: same vessel, heeled 20 degrees (just short of rail-down at 20.6) -->
  <g transform="translate(105 208) rotate(20) scale(1.2) translate(-60 -30)"><use href="#vessel"/></g>

  <!-- Panel B: same vessel, same scale, heeled 8 degrees -->
  <g transform="translate(315 208) rotate(8) scale(1.2) translate(-60 -30)"><use href="#vessel"/></g>

  <!-- Panel labels: identical primitive treatment, identical size, identical
       panel-relative position. No emphasis distinguishes either panel. -->
  <use href="#label-a" x="18" y="18" width="36" height="36"/>
  <use href="#label-b" x="228" y="18" width="36" height="36"/>
</svg>
