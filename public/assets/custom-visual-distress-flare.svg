<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Two visual signaling devices shown side by side as A and B.">
  <rect width="420" height="260" fill="#1a2436"/>
  <g transform="translate(130 170)">
    <rect x="-8" y="0" width="16" height="60" fill="#c9c2b0" stroke="#eee" stroke-width="1.5"/>
    <rect x="-10" y="-40" width="20" height="45" fill="#e0403a" stroke="#eee" stroke-width="1.5"/>
    <circle cx="0" cy="-60" r="26" fill="#ffcf5c" opacity="0.85"/>
    <circle cx="0" cy="-60" r="14" fill="#fff4cf"/>
  </g>
  <text x="130" y="245" font-family="sans-serif" font-size="13" fill="#eee" text-anchor="middle">A</text>
  <g transform="translate(300 160)">
    <rect x="-45" y="-55" width="90" height="60" fill="#e06c1f" stroke="#eee" stroke-width="2"/>
    <rect x="-15" y="-38" width="30" height="30" fill="#1a2436"/>
    <circle cx="0" cy="18" r="14" fill="#1a2436"/>
    <line x1="0" y1="5" x2="0" y2="70" stroke="#c9c2b0" stroke-width="3"/>
  </g>
  <text x="300" y="245" font-family="sans-serif" font-size="13" fill="#eee" text-anchor="middle">B</text>
</svg>
