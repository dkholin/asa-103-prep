<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Bilge cross-section with electric and manual water-removal equipment." >
  <rect width="420" height="260" fill="#f3ede2"/>
  <path d="M40 225 Q210 258 380 225 L380 240 L40 240 Z" fill="#5a6b78"/>
  <text x="210" y="253" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Bilge (lowest point of the hull)</text>
  <circle cx="100" cy="222" r="14" fill="#333"/>
  <text x="100" y="195" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Electric submersible</text>
  <text x="100" y="210" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">pump</text>
  <rect x="150" y="196" width="10" height="26" fill="#c05621"/>
  <text x="185" y="195" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">Float</text>
  <text x="185" y="209" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">switch</text>
  <line x1="155" y1="196" x2="255" y2="145" stroke="#333" stroke-width="2"/>
  <rect x="252" y="112" width="26" height="34" fill="#8a8a8a" stroke="#333" stroke-width="1.5"/>
  <text x="265" y="102" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Battery</text>
  <rect x="320" y="60" width="12" height="60" fill="#8a8a8a" stroke="#333" stroke-width="1.5"/>
  <circle cx="326" cy="55" r="10" fill="#c05621" stroke="#333" stroke-width="1.5"/>
  <text x="326" y="40" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Manual pump</text>
  <text x="326" y="135" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">(cockpit handle)</text>
</svg>
