<svg xmlns="http://www.w3.org/2000/svg" viewBox="-42 30 406 252" role="img" aria-label="Line diagram of one continuous rope made fast to a piling with a round turn and two half hitches. The standing part runs away to the lower left, wraps twice completely around the piling, and the working end then comes back along the standing part and is tied round it with two successive half hitches before ending in a free tail.">
  <!--
    Project-original geometry, constructed from the written tying sequence
    rather than traced from any published illustration.

    Round turn: generated from theta = -90 to 630 degrees, i.e. two complete
    passes around the piling, at a radius slightly larger than the post so the
    rope stays visible where it curls round the silhouette edges. The passes
    that fall behind the piling are hidden by it. Nothing is drawn as a
    free-standing ellipse, so the rope reads as a single continuous path.
      USCG Boat Crew Handbook, Seamanship Fundamentals 2-23: "A round turn is a
      complete turn or encircling of a line about an object"; 2-26: "A round
      turn or two, secured with a couple of half hitches, is a quick way to
      secure a line to a pole or spar."

    Half hitches: both are tied round the STANDING PART, not round the piling,
    and both the same way round, so together they form a clove hitch on the
    standing part. Each passes across the standing part, round behind it, and
    back under its own incoming leg.
      USCG, ibid. 2-25/2-26; Animated Knots by Grog, Round Turn & Two Half
      Hitches, and Two Half Hitches.

    The piling itself carries a plain two-pass wrap with no locking diagonal of
    its own, so the arrangement is visibly not a clove hitch tied on the piling.
  -->
