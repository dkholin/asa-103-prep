<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Diagram of a round turn and two half hitches: a line wrapped in a full round turn around a piling or ring, then finished with two half hitches around the standing part">
  <rect width="320" height="220" fill="#f5f0e6"/>
  <rect x="130" y="20" width="30" height="180" rx="8" fill="#a68f5c" stroke="#6b5a30" stroke-width="2"/>
  <ellipse cx="145" cy="90" rx="34" ry="20" fill="none" stroke="#2b6cb0" stroke-width="8"/>
  <ellipse cx="145" cy="105" rx="34" ry="20" fill="none" stroke="#2b6cb0" stroke-width="8"/>
  <path d="M179 105 q30 0 30 25 q0 20 -25 20 q-20 0 -20 -18" fill="none" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M164 130 q30 0 30 25 q0 20 -25 20 q-20 0 -20 -18" fill="none" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <line x1="145" y1="70" x2="145" y2="15" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <text x="160" y="15" font-family="sans-serif" font-size="12" fill="#333">Standing part</text>
  <text x="70" y="90" font-family="sans-serif" font-size="12" fill="#333">Round turn</text>
  <text x="60" y="180" font-family="sans-serif" font-size="12" fill="#333">Two half hitches finish the bend</text>
</svg>
