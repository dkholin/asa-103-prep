<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Overhead diagram of two converging sailboats and a marked wind direction.">
  <defs>
    <symbol id="sailboat" viewBox="-25 -42 50 84"><path d="M0-35 14-12 12 24Q0 33-12 24L-14-12Z" fill="currentColor" stroke="#133f68" stroke-width="2"/><path d="M0-24V21M0-19-16 10 0 15ZM2-17 15 8 2 13Z" fill="#fff" stroke="currentColor" stroke-width="1.5"/></symbol>
    <marker id="wind-head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#52697c"/></marker>
    <marker id="blue-head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#1d5c94"/></marker>
    <marker id="amber-head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#b85f24"/></marker>
  </defs>
  <rect width="420" height="300" fill="#edf6fa"/>
