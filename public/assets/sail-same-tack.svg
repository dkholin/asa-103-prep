<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Two sailing vessels on the same tack with the wind blowing from the left; boat A is closer to the wind (windward), boat B is farther from the wind (leeward)">
  <rect width="420" height="300" fill="#dcebf5"/>
  <!-- wind arrow from left -->
  <g stroke="#456" stroke-width="3" fill="none">
    <line x1="26" y1="150" x2="66" y2="150"/>
    <path d="M76 150 l-14 -8 v16 z" fill="#456" stroke="none"/>
  </g>
  <text x="46" y="132" font-family="sans-serif" font-size="14" fill="#456" text-anchor="middle">WIND</text>
  <!-- windward boat (closer to wind, left) -->
  <g transform="translate(170 150) rotate(15)">
    <path d="M0 -30 L11 -6 L11 24 L-11 24 L-11 -6 Z" fill="#b83280" stroke="#7d1f56" stroke-width="2"/>
    <path d="M0 -18 Q22 6 0 18 Z" fill="#f3d1e5" stroke="#7d1f56" stroke-width="1.5"/>
    <line x1="0" y1="-36" x2="0" y2="-62" stroke="#b83280" stroke-width="3"/>
    <path d="M0 -70 l-6 12 h12 z" fill="#b83280"/>
  </g>
  <text x="150" y="230" font-family="sans-serif" font-size="14" fill="#701d4c" text-anchor="middle">Boat A — windward</text>
  <!-- leeward boat (farther from wind, right) -->
  <g transform="translate(330 150) rotate(15)">
    <path d="M0 -30 L11 -6 L11 24 L-11 24 L-11 -6 Z" fill="#2c7a7b" stroke="#1d5354" stroke-width="2"/>
    <path d="M0 -18 Q22 6 0 18 Z" fill="#cfe8e8" stroke="#1d5354" stroke-width="1.5"/>
    <line x1="0" y1="-36" x2="0" y2="-62" stroke="#2c7a7b" stroke-width="3"/>
    <path d="M0 -70 l-6 12 h12 z" fill="#2c7a7b"/>
  </g>
  <text x="330" y="230" font-family="sans-serif" font-size="14" fill="#1d5354" text-anchor="middle">Boat B — leeward</text>
  <text x="210" y="282" font-family="sans-serif" font-size="13" fill="#456" text-anchor="middle">Both boats have the wind on the same side and are converging</text>
</svg>
