  <g stroke="#52697c" stroke-width="3" marker-end="url(#wind-head)"><path d="M20 43H82"/><path d="M20 70H100"/><path d="M20 97H82"/></g>
  <g transform="translate(160 158) rotate(15)" color="#1d5c94"><use href="#sailboat" x="-25" y="-42" width="50" height="84"/><path d="M0-50V-82" stroke="#1d5c94" stroke-width="3" marker-end="url(#blue-head)"/></g>
  <g transform="translate(310 158) rotate(15)" color="#b85f24"><use href="#sailboat" x="-25" y="-42" width="50" height="84"/><path d="M0-50V-82" stroke="#b85f24" stroke-width="3" marker-end="url(#amber-head)"/></g>
  <rect x="91" y="224" width="138" height="30" rx="15" fill="#fff" stroke="#cbdbe6"/><text x="160" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#133f68">A · windward</text>
  <rect x="241" y="224" width="138" height="30" rx="15" fill="#fff" stroke="#cbdbe6"/><text x="310" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#7c3f18">B · leeward</text>
  <path d="M145 275H325" stroke="#91a9ba" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="235" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52697c">converging on the same tack</text>
